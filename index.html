    <script>

        // Функция озвучки текста для детей (Web Speech API)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                // Останавливаем текущую речь, если она идет
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ru-RU';
                utterance.rate = 0.9; // Слегка замедленная четкая речь
                utterance.pitch = 1.1; // Дружелюбный тон
                window.speechSynthesis.speak(utterance);
            } else {
                console.log("Озвучка не поддерживается вашим браузером.");
            }
        }
    </script>
